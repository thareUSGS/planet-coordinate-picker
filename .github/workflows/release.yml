name: Build and publish QGIS ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches plug-in version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^version=//p' coordinate_picker_plugin/metadata.txt)"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match metadata version $VERSION." >&2
            exit 1
          fi

      - name: Package QGIS plug-in
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "PlanetCoordinatePicker-${RELEASE_TAG}.zip" coordinate_picker_plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: PlanetCoordinatePicker-${{ github.ref_name }}.zip
